events { worker_connections 4096; }

http {
    log_format perf '$remote_addr $request_time $upstream_response_time $status "$request"';
    access_log /var/log/nginx/access.log perf;
    upstream hmdp_backend {
        least_conn;
        server host.docker.internal:8081 max_fails=3 fail_timeout=10s;
        # 启动第二个 Spring Boot 实例后可取消注释：
        # server host.docker.internal:8082 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }
    # 本机 JMeter 通常只有一个源 IP，阈值要高于预期压测流量，避免测成 Nginx 限流能力。
    limit_req_zone $binary_remote_addr zone=seckill:10m rate=5000r/s;
    server {
        listen 80;
        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_pass http://hmdp_backend;
        }
        location ~ ^/voucher-order/seckill/ {
            limit_req zone=seckill burst=5000 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_pass http://hmdp_backend;
        }
    }
}
