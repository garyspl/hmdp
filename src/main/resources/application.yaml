  server:
    port: 8081
  spring:
    rabbitmq:
      host: localhost
      port: 5672
      username: guest
      password: guest
      publisher-confirm-type: correlated
      publisher-returns: true
      listener:
        simple:
          acknowledge-mode: auto
          prefetch: 50
          retry:
            enabled: true
            max-attempts: 3
            initial-interval: 200ms
    application:
      name: hmdp
    datasource:
      driver-class-name: com.mysql.jdbc.Driver
      url: jdbc:mysql://127.0.0.1:3306/dingping?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: root
      password: ${HMDP_MYSQL_PASSWORD:290390}
    redis:
      host: 127.0.0.1
      port: 6379

      lettuce:
        pool:
          max-active: 30
          max-idle: 15
          min-idle: 5
          time-between-eviction-runs: 10s
    jackson:
      default-property-inclusion: non_null # JSON处理时忽略非空字段
  mybatis-plus:
    type-aliases-package: com.hmdp.entity # 别名扫描包
  logging:
    level:
      com.hmdp: ${HMDP_LOG_LEVEL:info}
  hmdp:
    hotkey:
      enabled: ${HMDP_HOTKEY_ENABLED:false}
      app-name: hmdp
      etcd-server: ${HMDP_HOTKEY_ETCD:http://127.0.0.1:2379}
    reconcile:
      fixed-delay-ms: ${HMDP_RECONCILE_DELAY_MS:5000}
      pending-timeout-seconds: ${HMDP_PENDING_TIMEOUT_SECONDS:15}
      max-retries: ${HMDP_RECONCILE_MAX_RETRIES:5}
